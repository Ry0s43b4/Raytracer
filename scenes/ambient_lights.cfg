# Ambient light demo scene
# The ambient value controls the base brightness on ALL surfaces,
# even those facing away from any light source.
# Try tweaking ambient between 0.0 and 1.0 to see the effect.

camera:
{
    resolution = { width = 800; height = 600; };
    position = { x = 0.0; y = 2.0; z = -6.0; };
    rotation = { x = 15.0; y = 0.0; z = 0.0; };
    fieldOfView = 72.0;
};

primitives:
{
    spheres = (
        # Center sphere
        { x = 0.0;  y = 0.0; z = 5.0; r = 1.2; color = { r = 220; g = 80;  b = 80;  }; },
        # Left sphere — sits partially behind the center one to show occlusion
        { x = -2.8; y = 0.0; z = 6.0; r = 1.0; color = { r = 80;  g = 180; b = 80;  }; },
        # Right sphere
        { x = 2.8;  y = 0.0; z = 6.0; r = 1.0; color = { r = 80;  g = 80;  b = 220; }; },
        # Small sphere tucked behind the center one — mostly in shadow, lit by ambient only
        { x = 0.6;  y = 0.5; z = 7.2; r = 0.5; color = { r = 240; g = 200; b = 60;  }; }
    );

    planes = (
        # Floor
        { axis = "Y"; position = -1.2; color = { r = 180; g = 180; b = 180; }; }
    );
};

lights:
{
    # Ambient — raises the minimum brightness across the whole scene.
    # Set to 0.0 to see pitch-black shadows; raise it to soften them.
    ambient = 0.25;

    # Diffuse multiplier applied to both point and directional lights.
    diffuse = 0.75;

    # Single point light above and to the left — creates directional shadows.
    point = (
        { x = -3.0; y = 5.0; z = 1.0; }
    );

    directional = ();
};
