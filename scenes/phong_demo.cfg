# Phong reflection model demo
# Each sphere uses a different shininess value so you can compare
# the tightness of the specular highlight side by side.
#
#  shininess  16  → broad, soft highlight
#  shininess  64  → medium highlight
#  shininess 256  → tight, mirror-like spot

camera:
{
    resolution  = { width = 800; height = 600; };
    position    = { x = 0.0; y = 1.5; z = -6.0; };
    rotation    = { x = 10.0; y = 0.0; z = 0.0; };
    fieldOfView = 72.0;
};

primitives:
{
    spheres = (
        # Left — broad highlight (shininess 16)
        {
            x = -2.8; y = 0.0; z = 5.0; r = 1.1;
            color = { r = 200; g = 60; b = 60; };
            material = { type = "phong"; shininess = 16.0; specularStrength = 0.6; };
        },
        # Center — medium highlight (shininess 64)
        {
            x = 0.0; y = 0.0; z = 5.0; r = 1.1;
            color = { r = 60; g = 180; b = 60; };
            material = { type = "phong"; shininess = 64.0; specularStrength = 0.7; };
        },
        # Right — tight highlight (shininess 256)
        {
            x = 2.8; y = 0.0; z = 5.0; r = 1.1;
            color = { r = 60; g = 80; b = 210; };
            material = { type = "phong"; shininess = 256.0; specularStrength = 0.9; };
        },
        # Small matte sphere in the back — no material, flat diffuse only
        {
            x = 0.0; y = 0.6; z = 7.5; r = 0.5;
            color = { r = 220; g = 180; b = 60; };
        }
    );

    planes = (
        { axis = "Y"; position = -1.1; color = { r = 170; g = 170; b = 170; }; }
    );
};

lights:
{
    ambient = 0.15;
    diffuse = 0.85;

    # Point light above-right — produces the specular highlight
    point = (
        { x = 4.0; y = 6.0; z = 0.0; }
    );

    directional = ();
};
